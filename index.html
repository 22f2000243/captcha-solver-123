<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>CAPTCHA Solver</title><link href='https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css' rel='stylesheet'></head><body class='bg-gray-100 min-h-screen flex items-center justify-center p-4'><div class='bg-white p-8 rounded-lg shadow-md w-full max-w-md'><h1 class='text-3xl font-bold text-center mb-6 text-gray-800'>CAPTCHA Solver</h1><div class='flex justify-center mb-6'><img id='captchaImage' src='sample.png' alt='CAPTCHA Image' class='max-w-full h-auto border border-gray-300 rounded-md shadow-sm'></div><div class='mb-4'><label for='captchaInput' class='block text-gray-700 text-sm font-bold mb-2'>Enter CAPTCHA text:</label><input type='text' id='captchaInput' class='shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline' placeholder='Type the characters above'></div><button class='bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full'>Verify</button></div><script>document.addEventListener('DOMContentLoaded', () => {const urlParams = new URLSearchParams(window.location.search);const imageUrl = urlParams.get('url');const captchaImageElement = document.getElementById('captchaImage');if (imageUrl) {captchaImageElement.src = imageUrl;} else {captchaImageElement.src = 'sample.png';}});</script></body></html>
